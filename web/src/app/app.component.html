<div class="explorer">
  <header class="explorer-header">
    <div class="brand">
      <img src="radio-logo.png" alt="" width="40" height="40" />
      <div>
        <h1>Radialla</h1>
        <p class="brand-caption">{{ vm.i18n.t('tagline') }}</p>
      </div>
    </div>
    <div class="header-actions">
      <button
        class="icon-button panel-toggle"
        [attr.aria-expanded]="!vm.listCollapsed()"
        aria-controls="station-panel"
        [attr.aria-label]="vm.i18n.t(vm.listCollapsed() ? 'showList' : 'hideList')"
        (click)="vm.listCollapsed.set(!vm.listCollapsed())"
      >
        <app-icon [name]="vm.listCollapsed() ? 'radio' : 'down'" />
      </button>
    </div>
  </header>
  <app-station-map
    [stations]="vm.mapStations()"
    [overviewCountries]="vm.overviewCountries()"
    (selectCountry)="vm.chooseCountry($event)"
    [activeId]="vm.selected()?.id"
    [focusedStation]="vm.player.active()"
    [autoFocus]="!vm.followArea()"
    [countryCode]="vm.selectedCountry()"
    (browseArea)="vm.browseArea()"
    (locationSelected)="vm.onLocationSelected()"
    [favoritesOnly]="vm.onlyFavorites()"
    (areaChange)="vm.area.set($event)"
    (autoplayReady)="vm.requestAutoplay($event)"
    (selectStation)="vm.choose($event)"
    (toggleFavorites)="vm.onlyFavorites.set(!vm.onlyFavorites())"
  />
  <app-station-panel />
  <app-mini-player />
</div>
